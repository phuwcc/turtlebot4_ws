localization_inputs:
  ros__parameters:
    # Used only when Create 3 reports an unspecified (zero) variance.
    wheel_velocity_variance: 0.0025  # (m/s)^2
    gyro_velocity_variance: 0.0025   # (rad/s)^2
    # Create 3's imu and the Standard URDF imu_link have the same axes.
    # Their different origins do not affect angular velocity.
    gyro_frame: imu_link

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.15
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    # Order: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az.
    # Wheel twist contributes vx only. The Create 3 pose/yaw and its twist yaw
    # are correlated with the gyro and are excluded.
    odom0: navigation/wheel_odom
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    imu0: navigation/imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 10
